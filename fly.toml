# Fly.io config for the Tandem API (REST + Socket.IO).
# Postgres and Redis are external; their URLs are set with `fly secrets set`.
# Reference: https://fly.io/docs/reference/configuration/

app = 'tandem-7iulug'
primary_region = 'iad'

[build]
  dockerfile = 'apps/server/Dockerfile'

[deploy]
  release_command = './node_modules/.bin/prisma migrate deploy --schema apps/server/prisma/schema.prisma'

[env]
  HOST = '0.0.0.0'
  LOG_LEVEL = 'info'
  NODE_ENV = 'production'
  PORT = '4000'
  SOCKET_IO_REDIS_ADAPTER = 'true'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
