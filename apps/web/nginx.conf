server {
  listen 80;
  server_name _;

  # SPA fallback - any unknown path serves index.html so React Router can take over.
  root /usr/share/nginx/html;
  index index.html;

  # Cache static assets aggressively; index.html stays fresh so deployments
  # roll out immediately.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Tiny healthcheck endpoint for ALB/ECS.
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok";
  }
}
