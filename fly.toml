# Fly.io app for the API and WebSocket server.
# Postgres and Redis are attached separately. See docs/SHIP.md.
# Rename `app` if "cardroom" is already taken: fly apps create cardroom-yourname

app = "tandem-7iulug"
primary_region = "iad"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "4000"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  SOCKET_IO_REDIS_ADAPTER = "true"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[deploy]
  release_command = "npx prisma migrate deploy --schema apps/server/prisma/schema.prisma"
